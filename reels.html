<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Aura — Reels</title>
  <meta name="description" content="Watch, discover, and create immersive short vertical video Reels on Aura." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23e1306c'><rect width='24' height='24' rx='6'/><circle cx='12' cy='12' r='4' fill='white'/></svg>" />

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/reels.css" />
  <link rel="stylesheet" href="css/modals.css" />
  <link rel="stylesheet" href="css/auth.css" />

  <script>
    const savedTheme = localStorage.getItem('aura_theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
  </script>
</head>
<body class="reels-standalone-page view-reels-active">

  <!-- =========================================================================
       1. AUTHENTICATION SCREEN (FOR DIRECT LANDING)
       ========================================================================= -->
  <div id="auth-screen" class="auth-screen hidden">
    <div class="auth-container">
      <div class="auth-forms-column">
        <div id="login-card" class="auth-card">
          <h1 class="auth-logo-title">Aura</h1>
          <p style="text-align:center; color: var(--text-secondary); margin-bottom: 20px; font-size: 14px;">Sign in to watch & share Reels</p>
          <form id="login-form" class="auth-form">
            <input type="email" id="login-email" class="aura-input" placeholder="Email address" required />
            <input type="password" id="login-password" class="aura-input" placeholder="Password" required />
            <button type="submit" class="aura-btn aura-btn-primary auth-submit-btn">Log In</button>
          </form>
        </div>
        <div class="auth-switch-card">
          <span>Don't have an account? <a href="index.html">Sign up on Aura</a></span>
        </div>
      </div>
    </div>
  </div>

  <!-- =========================================================================
       2. REELS APP SHELL
       ========================================================================= -->
  <div id="app-shell" class="app-layout">

    <!-- Desktop Navigation Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <a href="index.html" class="brand-logo" aria-label="Aura Home">
          <span class="brand-text-default">Aura</span>
          <span class="bamboo-brand-logo" title="Aura Bamboo">
            <svg class="bamboo-logo-svg" viewBox="0 0 160 42" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M52 10 C 44 2, 32 -1, 20 2 C 32 6, 42 8, 52 10 Z" fill="#52b788" />
              <path d="M53 8 C 48 -1, 38 -5, 28 -3 C 38 1, 46 4, 53 8 Z" fill="#74c69d" />
              <path d="M54 13 C 44 14, 34 19, 26 27 C 36 23, 46 19, 54 13 Z" fill="#40916c" opacity="0.9" />
              <path d="M112 10 C 120 2, 132 -1, 144 2 C 132 6, 122 8, 112 10 Z" fill="#52b788" />
              <path d="M113 8 C 118 -1, 128 -5, 138 -3 C 128 1, 120 4, 113 8 Z" fill="#74c69d" />
              <path d="M112 32 C 122 36, 134 38, 142 36 C 132 31, 122 30, 112 32 Z" fill="#40916c" opacity="0.85" />
              <rect x="6" y="10" width="46" height="22" rx="4" fill="#2d6a4f" />
              <line x1="8" y1="13" x2="50" y2="13" stroke="#40916c" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />
              <rect x="49" y="8" width="6" height="26" rx="3" fill="#1b4332" />
              <rect x="50.5" y="9" width="3" height="24" rx="1.5" fill="#52b788" opacity="0.75" />
              <rect x="54" y="10" width="56" height="22" rx="3" fill="#2d6a4f" />
              <line x1="56" y1="13" x2="108" y2="13" stroke="#40916c" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />
              <rect x="109" y="8" width="6" height="26" rx="3" fill="#1b4332" />
              <rect x="110.5" y="9" width="3" height="24" rx="1.5" fill="#52b788" opacity="0.75" />
              <rect x="114" y="10" width="40" height="22" rx="4" fill="#2d6a4f" />
              <line x1="116" y1="13" x2="152" y2="13" stroke="#40916c" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />
              <text x="82" y="27" font-family="'Grand Hotel', cursive" font-size="24" font-weight="700" fill="#f7f9f3" text-anchor="middle" letter-spacing="1">Aura</text>
            </svg>
          </span>
        </a>

        <nav class="sidebar-nav">
          <!-- 1. Home -->
          <a href="index.html" class="nav-item">
            <span class="nav-icon">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1V9.5z"></path>
              </svg>
            </span>
            <span class="nav-label">Home</span>
          </a>

          <!-- 2. Search -->
          <a href="#" id="sidebar-search-btn" class="nav-item">
            <span class="nav-icon">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
            </span>
            <span class="nav-label">Search</span>
          </a>

          <!-- 3. Reels (Active on this page) -->
          <a href="reels.html" class="nav-item active">
            <span class="nav-icon">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                <polygon points="10 8 16 12 10 16 10 8" fill="var(--bg-primary)"></polygon>
              </svg>
            </span>
            <span class="nav-label">Reels</span>
          </a>

          <!-- 4. Messages -->
          <a href="messages.html" class="nav-item">
            <span class="nav-icon">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
              </svg>
            </span>
            <span class="nav-label">Messages</span>
          </a>

          <!-- 5. Notifications -->
          <a href="#" id="sidebar-notif-btn" class="nav-item">
            <span class="nav-icon">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"></path>
              </svg>
            </span>
            <span class="nav-label">Notifications</span>
          </a>

          <!-- 6. Create -->
          <a href="#" id="sidebar-create-btn" class="nav-item">
            <span class="nav-icon">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="12" y1="8" x2="12" y2="16"></line>
                <line x1="8" y1="12" x2="16" y2="12"></line>
              </svg>
            </span>
            <span class="nav-label">Create</span>
          </a>

          <!-- 7. Profile -->
          <a href="index.html?view=profile" class="nav-item">
            <span class="nav-icon">
              <img src="https://api.dicebear.com/7.x/adventurer/svg?seed=aura" alt="Avatar" class="sidebar-user-avatar" />
            </span>
            <span class="nav-label">Profile</span>
          </a>
        </nav>
      </div>

      <div class="sidebar-bottom">
        <a href="#" class="nav-item" id="sidebar-more-btn">
          <span class="nav-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
          </span>
          <span class="nav-label">More</span>
        </a>

        <div id="more-popup-menu" class="more-popup-menu">
          <button class="menu-item" id="menu-toggle-bamboo">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M7 3v18M17 3v18M7 9h10M7 15h10M17 6c2-2 4-2 4-2s0 2-2 4M7 12c-2-2-4-2-4-2s0 2 2 4M17 18c2-2 4-2 4-2s0 2-2 4"></path>
            </svg>
            <span id="menu-bamboo-label">Change to Bamboo theme</span>
          </button>
          <button class="menu-item" id="menu-toggle-theme">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
            Switch Appearance
          </button>
          <button class="menu-item logout" id="menu-logout">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
            Log Out
          </button>
        </div>
      </div>
    </aside>

    <!-- Mobile Top Transparent Reels Header -->
    <header class="reels-standalone-top-bar">
      <div class="reels-page-title-group">
        <span class="reels-page-title">Reels</span>
      </div>
      <div class="reels-top-actions">
        <!-- Sound Toggle -->
        <button id="reels-top-sound-btn" class="reels-top-icon-btn" aria-label="Toggle Sound">
          <svg class="icon-sound-on" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          </svg>
        </button>
        <!-- Camera / Create Reel Button -->
        <button id="reels-top-camera-btn" class="reels-top-icon-btn" aria-label="Record or Upload Reel">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
            <circle cx="12" cy="13" r="4"></circle>
          </svg>
        </button>
      </div>
    </header>

    <!-- Desktop Floating Arrow Scrollers -->
    <div class="reels-desktop-nav-arrows">
      <button id="reels-arrow-up" class="reels-floating-arrow" aria-label="Previous Reel" title="Previous Reel (Up Arrow)">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="18 15 12 9 6 15"></polyline>
        </svg>
      </button>
      <button id="reels-arrow-down" class="reels-floating-arrow" aria-label="Next Reel" title="Next Reel (Down Arrow)">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </button>
    </div>

    <!-- Main Reels Full-Screen Stage -->
    <main class="main-stage" style="padding: 0; max-width: 100vw; background: #000;">
      <div id="reels-page-stage" class="reels-page-stage">
        <div id="reels-container" class="reels-container"></div>
      </div>

      <!-- Native Reel Comments Bottom Sheet -->
      <div id="reel-comments-sheet" class="reel-comments-sheet">
        <div class="sheet-header">
          <span>Comments</span>
          <button id="reel-comments-close" class="drawer-close-btn">✕</button>
        </div>
        <div id="reel-comments-list" class="reel-comments-list"></div>
        <div class="sheet-footer">
          <div class="comments-quick-emojis" style="display:flex; gap:10px; margin-bottom:8px; font-size:18px; cursor:pointer;">
            <span class="quick-emoji">❤️</span>
            <span class="quick-emoji">🔥</span>
            <span class="quick-emoji">😂</span>
            <span class="quick-emoji">👏</span>
            <span class="quick-emoji">😍</span>
            <span class="quick-emoji">🙌</span>
            <span class="quick-emoji">✨</span>
          </div>
          <form id="reel-comment-form" class="post-comment-form">
            <input type="text" id="reel-comment-input" class="comment-input" placeholder="Add a comment for this reel..." required />
            <button type="submit" class="comment-submit-btn">Post</button>
          </form>
        </div>
      </div>
    </main>

    <!-- Mobile Bottom Navigation Bar -->
    <nav class="mobile-bottom-bar" id="mobile-bottom-bar">
      <!-- 1. Home -->
      <a href="index.html" class="mobile-nav-btn" aria-label="Home">
        <svg class="icon-outline" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1V9.5z"></path>
        </svg>
      </a>

      <!-- 2. Search -->
      <button id="mobile-search-trigger" class="mobile-nav-btn" aria-label="Search">
        <svg class="icon-outline" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <circle cx="11" cy="11" r="7.5"></circle>
          <line x1="21" y1="21" x2="16.5" y2="16.5"></line>
        </svg>
      </button>

      <!-- 3. Create [+] -->
      <button id="mobile-create-trigger" class="mobile-nav-btn" aria-label="Create">
        <svg class="icon-outline" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="5" ry="5"></rect>
          <line x1="12" y1="8" x2="12" y2="16" stroke-linecap="round"></line>
          <line x1="8" y1="12" x2="16" y2="12" stroke-linecap="round"></line>
        </svg>
      </button>

      <!-- 4. Reels (Active) -->
      <a href="reels.html" class="mobile-nav-btn active" aria-label="Reels">
        <svg class="icon-filled" width="25" height="25" viewBox="0 0 24 24" fill="currentColor">
          <rect x="2.5" y="2.5" width="19" height="19" rx="5"></rect>
          <path d="M16 2.5l-4 6M8 2.5l-4 6M12 8.5v13M2.5 8.5h19" stroke="var(--bg-primary)" stroke-width="1.5"></path>
          <polygon points="10 12 15 15 10 18" fill="var(--bg-primary)"></polygon>
        </svg>
      </a>

      <!-- 5. Profile -->
      <a href="index.html?view=profile" class="mobile-nav-btn mobile-profile-nav-btn" aria-label="Profile">
        <div class="mobile-avatar-frame">
          <img src="https://api.dicebear.com/7.x/adventurer/svg?seed=aura" alt="Avatar" class="mobile-user-avatar" />
        </div>
      </a>
    </nav>

    <!-- Slide-out Search Drawer -->
    <div id="search-drawer" class="slide-drawer">
      <div class="drawer-header">
        <h3>Search</h3>
        <button id="search-drawer-close" class="drawer-close-btn">✕</button>
      </div>
      <div class="search-input-wrap">
        <svg class="search-input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="search-drawer-input" class="aura-input" placeholder="Search people and #hashtags" />
      </div>
      <div id="search-results-list" class="search-results-list"></div>
    </div>

    <!-- Slide-out Notifications Drawer -->
    <div id="notifications-drawer" class="slide-drawer">
      <div class="drawer-header">
        <h3>Notifications</h3>
        <button id="notifications-drawer-close" class="drawer-close-btn">✕</button>
      </div>
      <div id="notifications-list" class="notifications-list"></div>
    </div>
  </div>

  <!-- =========================================================================
       3. CREATE REEL STUDIO MODAL
       ========================================================================= -->
  <div id="create-modal" class="aura-modal">
    <div class="create-modal-dialog">
      <div class="create-modal-header">
        <button id="create-modal-back" class="create-nav-btn back" style="display:none;">Back</button>
        <h3 id="create-modal-title">Create new Reel</h3>
        <button id="create-modal-next" class="create-nav-btn next" style="display:none;">Share</button>
        <button id="create-modal-close" class="modal-close-btn modal-close-trigger">✕</button>
      </div>

      <div class="create-mode-tabs-bar" style="display:none;">
        <button class="create-mode-tab active" data-mode="reel">Reels</button>
      </div>

      <div id="create-modal-body" class="create-modal-body"></div>
    </div>
  </div>

  <!-- Options Modal for Reel Actions (Delete Reel, Copy Link, Share) -->
  <div id="options-modal" class="aura-modal">
    <div class="modal-content-box options-modal-box">
      <div id="options-modal-list" class="options-modal-list"></div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Dedicated Reels Controller Script -->
  <script type="module" src="/js/reels-page.js"></script>
</body>
</html>
